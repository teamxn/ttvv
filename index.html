<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangoRichKiD TV</title>
    
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/fantasy/index.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914; 
            --bg-dark: #000;
            --sidebar-bg: #141414;
            --text-color: #e5e5e5;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg-dark);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Sidebar - Desktop */
        #sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            z-index: 1000;
        }

        .logo-area {
            padding: 20px;
            background: #000;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            border-bottom: 1px solid #333;
        }

        .search-box { padding: 15px; background: #121212; }
        .search-box input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        #channel-list { flex-grow: 1; overflow-y: auto; }
        #channel-list::-webkit-scrollbar { width: 8px; }
        #channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .channel-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }
        .channel-item:hover { background: #333; padding-left: 25px; }
        .channel-item.active { 
            background: #222; 
            border-left: 4px solid var(--primary);
            color: white;
            font-weight: bold;
        }

        /* Video Area */
        #main-content {
            flex-grow: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-js { width: 100%; height: 100%; }

        /* Breaking News Ticker */
        .breaking-news {
            width: 100%;
            background: #e50914;
            color: white;
            display: flex;
            align-items: center;
            height: 40px;
            font-size: 15px;
            z-index: 10;
        }

        .ticker-title {
            background: #000;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            white-space: nowrap;
        }

        .ticker-content {
            flex-grow: 1;
            overflow: hidden;
        }

        /* Responsive Layout (Mobile) */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            #sidebar { 
                width: 100%; 
                height: 55vh; 
                border-right: none;
                order: 2; 
            }
            #main-content {
                width: 100%;
                height: auto;
                position: sticky;
                top: 0;
                z-index: 1100;
                order: 1; 
            }
            .video-container {
                height: 35vh;
            }
            .logo-area { padding: 15px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="logo-area">
            <span><i class="fas fa-play-circle"></i> MangoRichKiD</span>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search channels..." onkeyup="filterChannels()">
        </div>
        
        <div id="channel-list">
            <div style="padding:20px; text-align:center; color:#666;">Loading Channels...</div>
        </div>
    </div>

    <div id="main-content">
        <div class="video-container">
            <video id="my-video" class="video-js vjs-big-play-centered vjs-theme-fantasy" controls preload="auto" data-setup='{"fluid": true}'>
                <p class="vjs-no-js">To view this video please enable JavaScript</p>
            </video>
        </div>

        <div class="breaking-news">
            <div class="ticker-title">ব্রেকিং নিউজ</div>
            <div class="ticker-content">
                <marquee behavior="scroll" direction="left" scrollamount="6">
                    MangoRichKiD TV-তে আপনাকে স্বাগতম! আপনার পছন্দের চ্যানেলটি দেখতে বাম পাশের তালিকা থেকে চ্যানেল নির্বাচন করুন। নিরবচ্ছিন্ন স্ট্রিমিং উপভোগ করুন।
                </marquee>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <script>
        const playlistUrl = 'playlist.m3u'; 
        var player = videojs('my-video');
        const channelList = document.getElementById('channel-list');
        const searchInput = document.getElementById('searchInput');
        var allChannels = []; 

        fetch(playlistUrl)
            .then(response => response.text())
            .then(data => {
                const lines = data.split('\n');
                channelList.innerHTML = ""; 
                let currentName = "";

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        let parts = line.split(',');
                        currentName = parts[1] || "Unknown Channel";
                    } else if (line.startsWith('http')) {
                        if(currentName) {
                            allChannels.push({ name: currentName, url: line });
                            createChannelElement(currentName, line);
                        }
                    }
                });
            })
            .catch(err => {
                channelList.innerHTML = `<div style="padding:20px; text-align:center; color:red;">Error loading playlist.</div>`;
            });

        function createChannelElement(name, url) {
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `<i class="fas fa-tv" style="margin-right:10px;"></i> ${name}`;
            div.onclick = () => {
                playStream(url);
                document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                if(window.innerWidth <= 768) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            channelList.appendChild(div);
        }

        function filterChannels() {
            const filter = searchInput.value.toUpperCase();
            channelList.innerHTML = ""; 
            const filtered = allChannels.filter(ch => ch.name.toUpperCase().includes(filter));
            filtered.forEach(ch => createChannelElement(ch.name, ch.url));
        }

        function playStream(source) {
            player.src({ src: source, type: 'application/x-mpegURL' });
            player.play();
        }
    </script>
</body>
</html>
